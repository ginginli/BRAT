<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Callback - Brat Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #8ACF01, #4D90CD);
        }
        .callback-container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8ACF01;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner"></div>
        <h2>Processing authentication...</h2>
        <p id="status-message">Please wait while we complete your sign-in.</p>
    </div>

    <script>
        // 处理认证回调
        document.addEventListener('DOMContentLoaded', function() {
            const statusMessage = document.getElementById('status-message');
            
            try {
                // 检查URL参数
                const urlParams = new URLSearchParams(window.location.search);
                const error = urlParams.get('error');
                const code = urlParams.get('code');
                
                if (error) {
                    // 处理错误
                    statusMessage.textContent = 'Authentication failed. Please try again.';
                    statusMessage.className = 'error';
                    
                    // 3秒后重定向回主页
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                } else if (code) {
                    // 处理成功回调
                    statusMessage.textContent = 'Authentication successful! Redirecting...';
                    statusMessage.className = 'success';
                    
                    // 将认证信息发送到父窗口
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'GOOGLE_AUTH_SUCCESS',
                            code: code
                        }, window.location.origin);
                        window.close();
                    } else {
                        // 如果没有父窗口，重定向到主页
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    }
                } else {
                    // 没有认证参数，重定向到主页
                    statusMessage.textContent = 'No authentication data found. Redirecting...';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                }
            } catch (error) {
                console.error('Callback error:', error);
                statusMessage.textContent = 'An error occurred. Redirecting...';
                statusMessage.className = 'error';
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            }
        });
    </script>
</body>
</html>
